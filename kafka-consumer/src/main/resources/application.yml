server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  metrics:
    tags:
      application: ${spring.application.name:kafka-consumer-app}
    export:
      prometheus:
        enabled: true
      cloudwatch:
        namespace: CustomKafkaMetrics  # Namespace for our custom metrics
        step: 1m  # How often to publish to CloudWatch
        batch-size: 20
        enabled: true
    # Configure metrics filtering
    enable:
      http: true
      jvm: true
    web:
      server:
        request:
          autotime:
            enabled: true

spring:
  application:
    name: kafka-consumer
  jmx:
    enabled: false  # Enable Spring JMX support
  kafka:
    consumer:
      bootstrap-servers: localhost:9092
      group-id: my-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        # Enable JMX reporting for Kafka consumer metrics
        metrics.recording.level: INFO
        # Set metrics sampling window to 5 seconds (default is 30s)
        metrics.sample.window.ms: 5000
        # Memory optimizations
        receive.buffer.bytes: 32768
        send.buffer.bytes: 32768
        # Reduce fetch size to limit memory usage
        max.partition.fetch.bytes: 1048576
        # Reduce cache size
        buffer.memory: 33554432
        # Max records per poll
        max.poll.records: 5
        # Auto-offset reset configuration
        auto.offset.reset: earliest
    listener:
      # Listener type for batch consumption
      type: batch
      # Control concurrency more explicitly
      concurrency: 3

# Configure logging
logging:
  level:
    com.example.kafkametrics: DEBUG
    org.apache.kafka: INFO
    # Set to WARN to hide the DENY messages
    io.micrometer.core.instrument.MeterFilter: WARN

# Metrics filtering configuration
# List of metrics to expose, all others will be filtered out
# You can use 'name.*' patterns to include a group of metrics
metrics:
  filter:
    allowed:
      - kafka.consumer.totalLag  # Our custom aggregated lag metric
      - kafka.consumer.fetch.manager.records.lag.max
      - custom.kafka.consumer.lag
      - jvm.memory.used
      - system.cpu.usage
      - http.server.requests
      - http.server.requests.active

app:
  kafka:
    topic: topic.x 

# JVM optimization settings to be set as environment variables in ECS task definition
# JAVA_OPTS: "-Xms512m -Xmx1536m -XX:+UseZGC -XX:+ZGenerational -XX:ConcGCThreads=2 -XX:ZCollectionInterval=5 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp" 

# Configure kafka-metrics module
kafka:
  metrics:
    step: PT10S
