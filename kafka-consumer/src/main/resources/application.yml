server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  metrics:
    tags:
      application: ${spring.application.name:kafka-consumer-app}
    export:
      prometheus:
        enabled: true
      cloudwatch:
        enabled: true
        namespace: KafkaConsumer
        step: 5000  # Increase to 1 minute to reduce memory pressure
        batch-size: 10  # Reduce batch size from default 20
        buffer-capacity: 200  # Reduce buffer capacity from default
        max-roll-forward-seconds: 120  # Memory safety for catch-up after delays

spring:
  application:
    name: kafka-consumer
  kafka:
    consumer:
      bootstrap-servers: localhost:9092
      group-id: my-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        # Memory optimizations
        receive.buffer.bytes: 32768
        send.buffer.bytes: 32768
        # Reduce fetch size to limit memory usage
        max.partition.fetch.bytes: 1048576
        # Reduce cache size
        buffer.memory: 33554432
        # Max records per poll
        max.poll.records: 5
        # Auto-offset reset configuration
        auto.offset.reset: earliest
    listener:
      # Listener type for batch consumption
      type: batch
      # Control concurrency more explicitly
      concurrency: 3

# Configure logging
logging:
  level:
    com.example.kafkametrics: DEBUG
    org.apache.kafka: INFO

# Metrics filtering configuration
# List of metrics to expose, all others will be filtered out
# You can use 'name.*' patterns to include a group of metrics
metrics:
  filter:
    allowed:
      - kafka.consumer.totalLag
      - jvm.memory.used
      - system.cpu.usage
    # - kafka.*
    
app:
  kafka:
    topic: topic.x 

# JVM optimization settings to be set as environment variables in ECS task definition
# JAVA_OPTS: "-Xms512m -Xmx1536m -XX:+UseZGC -XX:+ZGenerational -XX:ConcGCThreads=2 -XX:ZCollectionInterval=5 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp" 